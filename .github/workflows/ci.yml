name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si se sube un commit nuevo a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Base de datos PostgreSQL de prueba para que la aplicación pueda arrancar en los tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: garantia_test
          POSTGRES_USER: garantia
          POSTGRES_PASSWORD: garantia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garantia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/garantia_test
      SPRING_DATASOURCE_USERNAME: garantia
      SPRING_DATASOURCE_PASSWORD: garantia

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Si mvnw se subió desde Windows puede perder el permiso de ejecución
      - name: Dar permiso de ejecución a mvnw
        run: chmod +x mvnw

      - name: Compilar y ejecutar las pruebas
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Pruebas
        run: npx vitest run --passWithNoTests

      - name: Build
        run: npm run build
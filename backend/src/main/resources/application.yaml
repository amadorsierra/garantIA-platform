spring:
  application:
    name: garantia-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/garantia}
    username: ${DB_USUARIO:garantia}
    password: ${DB_PASSWORD:garantia}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crean las migraciones de Flyway; Hibernate solo comprueba que coincide
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

garantia:
  # Primera cuenta de Administrador (ver CreadorAdministrador). Vacío = no se crea.
  admin:
    email: ${GARANTIA_ADMIN_EMAIL:}
    password: ${GARANTIA_ADMIN_PASSWORD:}
